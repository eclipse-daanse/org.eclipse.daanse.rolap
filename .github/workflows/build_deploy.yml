name: Build, Test and Deploy

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  build_test:
    # the reusable workflow publishes the JUnit results as a check run; a called
    # workflow cannot widen the caller's token, so the scope is granted here
    permissions:
      contents: read
      checks: write
    uses: eclipse-daanse/.github/.github/workflows/reuse_java_build_test.yml@main
    # the maven cache is keyed by the poms, so it restores snapshot metadata
    # that predates a sibling repository's publish; -U re-checks it
    with:
      build-maven-args: '-U'
      test-maven-args: '-U'

  maven_deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: build_test
    uses: eclipse-daanse/.github/.github/workflows/reuse_java_deploy.yml@main
    secrets: inherit
