# Parallel execution restored from the legacy.xmla suite. There the whole
# series measured 56:08 at 8 threads, 67:09 at 4, 81:27 at 2 and 95:55 at 1,
# with agreeing failure counts. One thread stays the reference for judging a
# failure, not for running the suite.
#
# The dynamic strategy sizes the pool to the available cores: full width on a
# developer machine, 4 on a standard GitHub-hosted runner.
#
# Classes and methods both run concurrently. A class that rebuilds its own
# tables in setup opts out with @Execution(SAME_THREAD) - see
# ExplicitRecognizerTest - or its methods query a table a sibling is
# recreating.
#
# enabled and dynamic.factor below are overridden by the surefire
# configurationParameters in itests/pom.xml, which read the Maven properties
# daanse.test.parallel.enabled / daanse.test.parallel.factor (defaults in the
# root pom). Retune a build without editing this file:
#
#   mvn verify -Ddaanse.test.parallel.factor=2
#   mvn verify -Ddaanse.test.parallel.enabled=false
#
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 1
